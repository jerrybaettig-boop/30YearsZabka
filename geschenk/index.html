<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dis Gschänk wartet</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<header class="stickynav">
  <a href="../index.html" class="brand">🐸 Zabka-Fäscht</a>
</header>
<div class="wrap"><div id="app" class="card"></div></div>

<script>
const CODE = "11.11.22"; // wird Zeiche für Zeiche ufdeckt

const QUESTIONS = [
  { q: "Wo hend mer üs kennegleert?",
    opts: ["Über Tinder", "Über ihre Brüeder", "Ah re Hochzit vo Fründe", "Im Fitnessstudio"], correct: 1 },
  { q: "Wohin sind mer für's erschte Date gfahre?",
    opts: ["Pizza z Züri", "Kino und Popcorn", "Nachbarsgarte, Winterthur", "Brunch am Sonntig"], correct: 2 },
  { q: "Wie hät üses Häsli gheisse?",
    opts: ["Bugs", "Blacky", "Karotte", "Shadow"], correct: 1 },
  { q: "Und wie hät üses Meerschwiili gheisse (obwohl's e Sie gsi isch)?",
    opts: ["Herkules", "Simba", "Speedy", "Whiskers"], correct: 0 },
  { q: "Wie nänn ich sie, wenn mer i Südamerika underwegs sind?",
    opts: ["Gorda", "Ranita", "Mariposa", "Chiquita"], correct: 1 },
  { q: "Was hät si früener, wo mer üs kennegleert hend, immer bstellt?",
    opts: ["Sushi", "Salat", "Burgermeister-Burger", "Döner"], correct: 2 },
  { q: "Was isch üses verruckteschte Erläbnis gsi?",
    opts: ["Fluag verpasst z Bangkok", "Alternativ-Tour zum Machu Picchu", "Sturm uf emne Kreuzfahrtschiff", "Autopanne i de Wüeschti"], correct: 1 },
  { q: "Syt welem Datum sind mer offiziell zäme?",
    opts: ["14.02.2022", "01.01.2023", "11.11.2022", "24.12.2022"], correct: 2 }
];

let step = 0;
let revealed = "";

function render(){
  const app = document.getElementById("app");
  if(step === 0){
    app.innerHTML = `
      <div class="emoji-big">🔒🐸</div>
      <h1 style="text-align:center">Bevor's witergoht...</h1>
      <p style="text-align:center">Es paar Frage über üs. Jedi richtigi Antwort deckt es Zeiche vom Code uf. Wenn's chnorzt: frag doch öpper wo's weiss 😉</p>
      <div class="center"><button class="btn" id="start">Los</button></div>
    `;
    document.getElementById("start").onclick = () => { step = 1; render(); };
    return;
  }
  if(step >= 1 && step <= QUESTIONS.length){
    const q = QUESTIONS[step-1];
    const pct = Math.round(((step-1)/QUESTIONS.length)*100);
    app.innerHTML = `
      <div class="tag">Frag ${step} vo ${QUESTIONS.length}</div>
      <div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>
      <h2>${q.q}</h2>
      <div class="opt-grid">
        ${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}
      </div>
      <p class="small" id="code-progress">Code bis jetzt: ${revealed || "—"}</p>
    `;
    document.querySelectorAll(".opt").forEach(btn=>{
      btn.onclick = () => {
        const i = parseInt(btn.dataset.i);
        if(i === q.correct){
          revealed += CODE[step-1];
          btn.classList.add("correct");
          setTimeout(()=>{ step++; render(); }, 500);
        } else {
          btn.classList.add("wrong");
          setTimeout(()=>btn.classList.remove("wrong"), 600);
        }
      };
    });
    return;
  }
  sessionStorage.setItem("geschenk-unlocked", "1");
  app.innerHTML = `
    <div class="emoji-big">🔓</div>
    <h1 style="text-align:center">Code entdeckt</h1>
    <div class="center" style="font-size:38px; font-weight:800; letter-spacing:3px; margin:12px 0 20px;">${CODE}</div>
    <p style="text-align:center">Genau das Datum, wo alles offiziell worde isch. Und drum au de Schlüssel zu dim Gschänk.</p>
    <div class="center"><button class="btn" id="continue">Gschänk öffne</button></div>
  `;
  document.getElementById("continue").onclick = () => { window.location.href = "quiz.html"; };
}

render();
</script>
</body>
</html>
