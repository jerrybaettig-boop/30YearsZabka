<body>

<div class="wrap"><div class="card" id="app"></div></div>

<script>

if(sessionStorage.getItem("geschenk-unlocked") !== "1"){

  {id:'friedrichstadt', name:'Friedrichstadt', land:'Nordfriesland, DE', blurb:'Chlini holländischi Grachtestadt, Rueih und frischi Nordsee-Luft, Watt zum Erkunde.', party:0, nature:3, culture:1, budget:1, warmth:1, coastal:2},

const QUESTIONS = [

    {t:'Berge, frischi Luft', img:'../images/quiz-berge.jpg', warmth:-2, nature:2},
    {t:'Pulsierendi Grossstadt', img:'../images/quiz-stadt2.jpg', culture:2}
  ]},
  {q:'Wo wetsch din Abig verbringe?', type:'image', opts:[

    {t:'Gmüetlich mit emene Buech', img:'../images/quiz-buch.jpg', party:-2, culture:1},
    {t:'Im Club bis spät', img:'../images/quiz-club.jpg', party:3, companion:-1}
  ]},
  {q:'Wenn's ums Ässe goht, lieber:', type:'text', opts:[

    {t:'Hipps veggie Restaurant', budget:1, culture:2},

  ]},

  ]},
  {q:'Koffer isch bi dir ja immer scho 3 Wuche vorher packt — was packsch zerscht:', type:'image', opts:[
    {t:'Wanderschueh', img:'../images/quiz-wandern.jpg', nature:2},
    {t:'S schickschte Usgang-Outfit', img:'../images/quiz-ausgehen.jpg', party:1, budget:1},
    {t:'Sunnecreme', img:'../images/quiz-sonnencreme.jpg', warmth:3, coastal:1}
  ]},
  {q:'Wieviel Höhemeter am Tag sind ok?', type:'text', opts:[
    {t:'0, ich chille am Pool', nature:-2, budget:1},
    {t:'Chli wandere isch schön', nature:1},
    {t:'2000 wie am Choquequirao, bring it on', nature:3}
  ]},
  {q:'Nacheme N1-Dienst (12-Stünder) bruuchsch du…', type:'text', opts:[

  ]},
  {q:'Wenn's im Hotel achunsch, zerscht mal…', type:'image', opts:[

  ]},

  ]},
  {q:'Wie wetsch huusä?', type:'text', opts:[

  ]},

  ]},
  {q:'Perfekte Obig?', type:'text', opts:[

  ]},

  ]},
  {q:'20 km z Fuess — lieber durab...', type:'image', opts:[

    {t:'Strasse und Shops ere Grossstadt', img:'../images/quiz-stadt.jpg', culture:2},
    {t:'Am Strand entlang', img:'../images/quiz-beach.jpg', coastal:3}
  ]},
  {q:'Dis bisherigs Reis-Highlight isch eher gsi wie...', type:'text', opts:[
    {t:'Peru/Kolumbie: Abentür und Kultur pur', culture:2, nature:2},
    {t:'Tromsø: Rueih, Landschaft, Chelti', nature:3, warmth:-2},
    {t:'Athen: Stadt-Flair und Gschicht', culture:3}
  ]},
  {q:'Was killt d Reis-Luune garantiert?', type:'text', opts:[
    {t:'Umenandsitze, nüt erläbe', nature:1, culture:1},
    {t:'Kakerlake im Zimmer'},
    {t:'Nüt, so lang min Chnobli debi isch 🐸💚', companion:1}
  ]},
  {q:'Wenn d Reis es Motto hätt, wär's...', type:'image', opts:[
    {t:'Chaos, wo am Schluss doch klappt', img:'../images/quiz-abenteuer.jpg', nature:2},
    {t:'Sunne, Meer, nüt tue', img:'../images/quiz-sonne.jpg', warmth:2, budget:1, coastal:2},
    {t:'Mitm Flitzer durab d City düse', img:'../images/quiz-city.jpg', culture:2}
  ]},
];

const STORAGE_KEY = 'geschenk-progress';

let state = {
  step: 0,
  answers: [],
  axes: {party:0, nature:0, culture:0, budget:0, companion:0, warmth:0, coastal:0},
  season: '',
  top2: [],
  chosen: null,
  dates: {wish:{from:'',to:''}, alt1:{from:'',to:''}, alt2:{from:'',to:''}, notPlannable:false}
};

function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
function clearProgress(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
}

function computeMatches(){
  const scored = DESTS.map(d=>{
    const diff = Math.abs(d.party-state.axes.party)+Math.abs(d.nature-state.axes.nature)+
                 Math.abs(d.culture-state.axes.culture)+Math.abs(d.budget-state.axes.budget)+
                 Math.abs(d.warmth-state.axes.warmth)+Math.abs(d.coastal-state.axes.coastal);
    return {...d, score:-diff};
  });
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0,2);
}

function checkGateAndRender(){
  const app = document.getElementById('app');
  if(localStorage.getItem('geschenk-completed') === '1'){
    app.innerHTML = `
      <div class="emoji-big">🔐</div>
      <h1 style="text-align:center">Scho abgschlosse</h1>
      <p style="text-align:center">Das Gschänk-Quiz isch scho fertig usgfüllt worde. Wenn öppis nöd gstimmt hät, cha's mit emene Code zruckgsetzt werde.</p>
      <div class="locked-box">
        <input type="text" id="admin-code" placeholder="Admin-Code">
        <button class="btn secondary" id="admin-submit" style="width:100%">Zruecksetze</button>
      </div>
    `;
    document.getElementById('admin-submit').onclick = () => {
      const val = document.getElementById('admin-code').value.trim();
      if(val === ADMIN_CODE){
        localStorage.removeItem('geschenk-completed');
        clearProgress();
        location.reload();
      } else {
        alert('Code stimmt nöd.');
      }
    };
    return;
  }
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved){
    try{
      const parsed = JSON.parse(saved);
      if(parsed.step > 0){
        app.innerHTML = `
          <div class="emoji-big">👋</div>
          <h1 style="text-align:center">Willkomme zrugg</h1>
          <p style="text-align:center">Du bisch scho mitte dinne gsi. Witermache oder vo vorne aafo?</p>
          <div class="center btn-row" style="justify-content:center">
            <button class="btn" id="resume">Witermache</button>
            <button class="btn secondary" id="restart">Vo vorne aafo</button>
          </div>
        `;
        document.getElementById('resume').onclick = () => { state = parsed; render(); };
        document.getElementById('restart').onclick = () => { clearProgress(); render(); };
        return;
      }
    }catch(e){}
  }
  render();
}

function render(){
  const app = document.getElementById('app');
  if(state.step === 0) app.innerHTML = renderIntro();
  else if(state.step >= 1 && state.step <= QUESTIONS.length) app.innerHTML = renderQuestion(state.step-1);
  else if(state.step === QUESTIONS.length+1) app.innerHTML = renderReveal();
  else if(state.step === QUESTIONS.length+2) app.innerHTML = renderDates();
  else if(state.step === QUESTIONS.length+3) app.innerHTML = renderVoucher();
  attachEvents();
}

function renderIntro(){
  return `
    <div class="emoji-big">🧳🐸</div>
    <h1 style="text-align:center">Dis perfekte Trip wartet</h1>
    <p style="text-align:center">20 Frage, vili dervo typisch du. Am Schluss weiss d App genau, wohin d Reis goht — du entscheidsch de Räscht.</p>
    <div class="center"><button class="btn" id="start">Los goht's</button></div>
  `;
}

function renderQuestion(i){
  const q = QUESTIONS[i];
  const pct = Math.round((i/QUESTIONS.length)*100);
  const opts = q.type === 'image'
    ? `<div class="img-grid" style="grid-template-columns:repeat(${q.opts.length}, 1fr)">${q.opts.map((o,idx)=>`
        <button class="opt-img" data-i="${idx}">
          <img src="${o.img}" alt="${o.t}" onerror="this.style.display='none'">
          <div class="cap">${o.t}</div>
        </button>`).join('')}</div>`
    : `<div class="opt-grid">${q.opts.map((o,idx)=>`<button class="opt" data-i="${idx}">${o.t}</button>`).join('')}</div>`;
  return `
    <div class="tag">Frag ${i+1} vo ${QUESTIONS.length}</div>
    <div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>
    <h2>${q.q}</h2>
    ${opts}
  `;
}

function renderReveal(){
  state.top2 = computeMatches();
  const c = state.axes.companion;
  const companionLabel = c > 0 ? 'zu zwöit, ganz romantisch 💞' : c < 0 ? 'mit Fründe, viel Trubel 🎉' : 'offe für beides 🤷';
  return `
    <div class="emoji-big">🎯</div>
    <h1 style="text-align:center">Match gfunde!</h1>
    <p style="text-align:center">Reis-Vibe: <b>${companionLabel}</b><br>Da sind dini zwei Top-Matches. Wähl us:</p>
    <div class="dest-grid">
      ${state.top2.map(d=>`
        <button class="dest-card" data-id="${d.id}">
          <div class="name">${d.name} <span style="font-weight:400;font-size:13px;color:var(--ink-soft)">— ${d.land}</span></div>
          <p class="blurb">${d.blurb}</p>
        </button>
      `).join('')}
    </div>
  `;
}

function renderDates(){
  const np = state.dates.notPlannable;
  return `
    <div class="tag">Fascht gschafft</div>
    <h2>Wenn söll's losgoh?</h2>
    <p>Gib es verlängerts Wuchenänd als Wunschtermin a, plus zwei Alternative.</p>
    <div class="field"><label>🌟 Wunschtermin</label><div class="daterow">
      <input type="date" id="wish-from" value="${state.dates.wish.from}" ${np?'disabled':''}><input type="date" id="wish-to" value="${state.dates.wish.to}" ${np?'disabled':''}></div></div>
    <div class="field"><label>Alternative 1</label><div class="daterow">
      <input type="date" id="alt1-from" value="${state.dates.alt1.from}" ${np?'disabled':''}><input type="date" id="alt1-to" value="${state.dates.alt1.to}" ${np?'disabled':''}></div></div>
    <div class="field"><label>Alternative 2</label><div class="daterow">
      <input type="date" id="alt2-from" value="${state.dates.alt2.from}" ${np?'disabled':''}><input type="date" id="alt2-to" value="${state.dates.alt2.to}" ${np?'disabled':''}></div></div>
    <label style="display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; margin-bottom:10px; cursor:pointer">
      <input type="checkbox" id="not-plannable" ${np?'checked':''} style="width:18px; height:18px;">
      Momentan nöd planbar (Schichtplan fehlt), gib ich bald durab
    </label>
    <p class="small" id="date-error" style="color:var(--pink-d); display:none">Bitte alli drü Termin agäh oder s Kästli aachrüze.</p>
    <div class="center" style="margin-top:14px"><button class="btn" id="submit-dates">Spichere und abschicke</button></div>
  `;
}

function renderVoucher(){
  const d = state.chosen;
  return `
    <div class="emoji-big">🎁</div>
    <h1 style="text-align:center">Dis Gschänk-Gutschii</h1>
    <img src="../images/jerry-photo.jpg" class="voucher-photo" alt="Jerry" onerror="this.style.display='none'">
    <div class="card" style="background:#F7FCF8; box-shadow:none; border:2px dashed var(--leaf);">
      <p style="text-align:center; font-size:18px; font-weight:800; color:var(--leaf-d); margin-bottom:4px;">Citytrip nach ${d?d.name:''}, ${d?d.land:''}</p>
      <p style="text-align:center; margin-bottom:16px;">${state.dates.notPlannable ? 'Termin folgt sobald de Schichtplan da isch' : (state.dates.wish.from+' bis '+state.dates.wish.to)}</p>
      <div class="divider"></div>
      <p style="font-style:italic; text-align:center;">"Liebi Zabka 🐸<br><br>
      Dr Chnobli freut sich riesig uf e tolli Reis mit sinere altä, aber na sehr knackige und tolle Zabka. Alles wird organisiert — packe muesch nur na dis Lächle. 💚<br><br>
      In Liebi, dis Chnobli"</p>
    </div>
    <div class="center" style="margin-top:20px">
      <button class="btn" id="print-btn">Als PDF spichere</button>
    </div>
    <p class="small">Tipp: im Druck-Dialog "Als PDF spichere" auswähle.</p>
  `;
}

function attachEvents(){
  const start = document.getElementById('start');
  if(start) start.onclick = () => { state.step = 1; saveProgress(); render(); };

  document.querySelectorAll('.opt, .opt-img').forEach(btn=>{
    btn.onclick = () => {
      const i = state.step-1;
      const q = QUESTIONS[i];
      const opt = q.opts[btn.dataset.i];
      state.answers.push({question:q.q, answer:opt.t});
      if(i === 0) state.season = opt.t;
      ['party','nature','culture','budget','companion','warmth','coastal'].forEach(ax=>{
        if(opt[ax]) state.axes[ax] += opt[ax];
      });
      state.step++;
      saveProgress();
      render();
    };
  });

  document.querySelectorAll('.dest-card').forEach(btn=>{
    btn.onclick = () => {
      state.chosen = state.top2.find(d=>d.id===btn.dataset.id);
      state.step++;
      saveProgress();
      render();
    };
  });

  const npBox = document.getElementById('not-plannable');
  if(npBox){
    npBox.onchange = () => {
      state.dates.notPlannable = npBox.checked;
      render();
    };
  }

  const submitDates = document.getElementById('submit-dates');
  if(submitDates){
    submitDates.onclick = async () => {
      const np = document.getElementById('not-plannable').checked;
      state.dates.notPlannable = np;
      if(!np){
        state.dates.wish.from = document.getElementById('wish-from').value;
        state.dates.wish.to = document.getElementById('wish-to').value;
        state.dates.alt1.from = document.getElementById('alt1-from').value;
        state.dates.alt1.to = document.getElementById('alt1-to').value;
        state.dates.alt2.from = document.getElementById('alt2-from').value;
        state.dates.alt2.to = document.getElementById('alt2-to').value;
        const allFilled = state.dates.wish.from && state.dates.wish.to &&
                           state.dates.alt1.from && state.dates.alt1.to &&
                           state.dates.alt2.from && state.dates.alt2.to;
        if(!allFilled){
          document.getElementById('date-error').style.display = 'block';
          return;
        }
      }
      await submitToFormspree();
      localStorage.setItem('geschenk-completed', '1');
      clearProgress();
      state.step++;
      render();
    };
  }

  const printBtn = document.getElementById('print-btn');
  if(printBtn) printBtn.onclick = () => window.print();
}

async function submitToFormspree(){
  const payload = {
    _subject: "🎁 Fabis Reise-Quiz ist fertig!",
    season: state.season,
    chosenDestination: state.chosen ? `${state.chosen.name} — ${state.chosen.land}` : '',
    topMatches: state.top2.map(d=>d.name).join(', '),
    wunschtermin: state.dates.notPlannable ? 'nöd planbar, folgt' : `${state.dates.wish.from} bis ${state.dates.wish.to}`,
    alternative1: state.dates.notPlannable ? '-' : `${state.dates.alt1.from} bis ${state.dates.alt1.to}`,
    alternative2: state.dates.notPlannable ? '-' : `${state.dates.alt2.from} bis ${state.dates.alt2.to}`,
    alle_antworten: state.answers.map(a=>`${a.question} -> ${a.answer}`).join(' | ')
  };
  try{
    await fetch(FORMSPREE_ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'Accept':'application/json'},
      body: JSON.stringify(payload)
    });
  }catch(e){
    console.error('Formspree-Versand fehlgschlage', e);
  }
}

checkGateAndRender();
</script>
</body>
</html>
