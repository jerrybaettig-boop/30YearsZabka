<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Zabka-Vespa-Sprint</title>
<link rel="stylesheet" href="assets/style.css">
<style>
body{overscroll-behavior:none;}
.game-page-wrap{max-width:480px; margin:0 auto; padding:16px;}
#gameCanvas{width:100%; height:auto; display:block; border-radius:20px; touch-action:none; background:#555;}
.game-shell{position:relative; border-radius:20px; overflow:hidden; box-shadow:0 12px 34px rgba(47,143,91,0.2); border:2px solid #E3F5E9;}
.game-overlay{
  position:absolute; inset:0; background:rgba(18,48,36,0.85); color:#fff;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:20px; gap:10px; z-index:5;
}
.game-overlay h2{font-family:'Baloo 2',sans-serif; font-size:24px; margin:0; color:#FFD37A;}
.game-overlay p{color:#EAF7EC; margin:0; font-size:14px;}
.game-hud{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-family:'Baloo 2',sans-serif; font-weight:700; color:var(--leaf-d); font-size:15px;}
.title-compact{margin-bottom:10px;}
.title-compact h1{margin-bottom:2px; font-size:22px;}
.title-compact p{margin:0; font-size:13px;}
</style>
</head>
<body>
<header class="stickynav">
  <a href="index.html" class="brand">🐸 Zabka-Fäscht</a>
  <a href="index.html" class="back">← zrugg</a>
</header>
<div class="game-page-wrap">
  <div class="title-compact">
    <h1>🛵 Zabka-Vespa-Sprint</h1>
    <p>Wich de rote Ample us, schnapp dir jedi grüni. Zieh mit Finger uf/ab.</p>
  </div>

  <div class="game-hud"><span id="score-display">🟢 0</span><span id="highscore-display">Rekord: 0</span></div>
  <div class="game-shell">
    <canvas id="gameCanvas" width="380" height="680"></canvas>
    <div class="game-overlay" id="overlay">
      <h2>Bereit?</h2>
      <p>Rot = Bussgäld. Grün = Punkt. Zürich-Verkehr wartet uf niemert.</p>
      <button class="btn" id="start-btn">Gas gäh</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const overlay = document.getElementById('overlay');
const scoreDisplay = document.getElementById('score-display');
const highscoreDisplay = document.getElementById('highscore-display');
const startBtn = document.getElementById('start-btn');

const CAP = 25;
let highscore = parseInt(localStorage.getItem('vespa-game-highscore') || '0');
highscoreDisplay.textContent = 'Rekord: ' + highscore;

let state = 'idle';
let player = { x: 66, y: H/2, targetY: H/2, r: 26 };
let reds = [];
let greens = [];
let score = 0;
let elapsed = 0;
let lastRedSpawn = 0;
let lastGreenSpawn = 0;
let animId = null;
let lastTime = 0;
let swarm = [];

function reset(){
  player.y = H/2; player.targetY = H/2;
  reds = []; greens = []; swarm = [];
  score = 0; elapsed = 0; lastRedSpawn = 0; lastGreenSpawn = 0;
  scoreDisplay.textContent = '🟢 0';
}

function currentSpeed(){ return Math.min(3.2 + elapsed*0.075, 8.5); }
function redSpawnInterval(){ return Math.max(950 - elapsed*28, 300); }
function greenSpawnInterval(){ return Math.max(1900 - elapsed*12, 1000); }

function spawnRed(){
  const r = 20;
  const y = r + Math.random()*(H - 2*r);
  reds.push({x: W+r, y, r});
}
function spawnGreen(){
  const r = 18;
  const y = r + Math.random()*(H - 2*r);
  greens.push({x: W+r, y, r});
}

function update(dt){
  elapsed += dt/1000;
  const speed = currentSpeed();
  player.y += (player.targetY - player.y) * Math.min(1, dt/90);
  player.y = Math.max(player.r, Math.min(H-player.r, player.y));

  lastRedSpawn += dt;
  if(lastRedSpawn > redSpawnInterval()){ spawnRed(); lastRedSpawn = 0; }
  lastGreenSpawn += dt;
  if(lastGreenSpawn > greenSpawnInterval()){ spawnGreen(); lastGreenSpawn = 0; }

  reds.forEach(o => o.x -= speed*(dt/16.7));
  greens.forEach(o => o.x -= speed*(dt/16.7));
  reds = reds.filter(o => o.x > -30);
  greens = greens.filter(o => o.x > -30);

  for(const o of reds){
    const dx = o.x-player.x, dy = o.y-player.y;
    if(Math.sqrt(dx*dx+dy*dy) < o.r+player.r-4){ startSwarm(false); return; }
  }
  greens = greens.filter(o => {
    const dx = o.x-player.x, dy = o.y-player.y;
    if(Math.sqrt(dx*dx+dy*dy) < o.r+player.r){
      score++;
      scoreDisplay.textContent = '🟢 ' + score;
      if(score >= CAP){ startSwarm(true); }
      return false;
    }
    return true;
  });
}

function drawRoad(){
  ctx.fillStyle = '#4a4a4a'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 4;
  ctx.setLineDash([22,18]);
  const offset = (elapsed*140) % 40;
  ctx.beginPath(); ctx.moveTo(0, H/2); ctx.lineTo(W, H/2); ctx.stroke();
  ctx.setLineDash([]);
}

function drawPlayer(){
  ctx.font = '42px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🛵', player.x, player.y);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawRoad();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '34px serif';
  reds.forEach(o => ctx.fillText('🔴', o.x, o.y));
  ctx.font = '30px serif';
  greens.forEach(o => ctx.fillText('🟢', o.x, o.y));
  drawPlayer();
}

function loop(t){
  if(state !== 'playing'){ return; }
  const dt = Math.min(t-lastTime, 40); lastTime = t;
  update(dt);
  draw();
  animId = requestAnimationFrame(loop);
}

function startGame(){
  reset();
  state = 'playing';
  overlay.style.display = 'none';
  lastTime = performance.now();
  animId = requestAnimationFrame(loop);
}

function startSwarm(won){
  cancelAnimationFrame(animId);
  state = 'swarming';
  swarm = [];
  const swarmStart = performance.now();
  function swarmStep(t){
    const p = Math.min((t-swarmStart)/700, 1);
    if(swarm.length < 45 && Math.random() < 0.9){
      swarm.push({ x: Math.random()*W, y: Math.random()*H, size: 20+Math.random()*26, rot: Math.random()*Math.PI*2 });
    }
    ctx.clearRect(0,0,W,H);
    drawRoad();
    if(!won) drawPlayer();
    ctx.textAlign='center'; ctx.textBaseline='middle';
    swarm.forEach(s => {
      ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.rot);
      ctx.font = s.size+'px serif';
      ctx.fillText(won ? '🟢' : '🚨', 0, 0);
      ctx.restore();
    });
    if(p < 1){ requestAnimationFrame(swarmStep); } else { endGame(won); }
  }
  requestAnimationFrame(swarmStep);
}

function endGame(won){
  state = won ? 'win' : 'over';
  if(score > highscore){
    highscore = score;
    localStorage.setItem('vespa-game-highscore', highscore);
    highscoreDisplay.textContent = 'Rekord: ' + highscore;
  }
  overlay.innerHTML = won
    ? `<h2>🛵💨 Nie erwütscht!</h2><p>25 grüni gschafft. D Pölizei hät käi Chance gäge dich.</p><button class="btn" id="restart-btn">Nomol</button>`
    : `<h2>Bussgäld! 🚨</h2><p>${score} grüni gschafft. ${score>=highscore && score>0 ?'Neue Rekord! 🎉':'Versuechs nomol!'}</p><button class="btn" id="restart-btn">Nomol</button>`;
  overlay.style.display = 'flex';
  document.getElementById('restart-btn').onclick = startGame;
}

startBtn.onclick = startGame;

function setTargetFromEvent(clientY){
  const rect = canvas.getBoundingClientRect();
  const scale = H / rect.height;
  player.targetY = (clientY - rect.top) * scale;
}
canvas.addEventListener('pointermove', e => { if(state==='playing') setTargetFromEvent(e.clientY); });
canvas.addEventListener('pointerdown', e => { if(state==='playing') setTargetFromEvent(e.clientY); });
canvas.addEventListener('touchstart', e => { if(state==='playing'){ setTargetFromEvent(e.touches[0].clientY); e.preventDefault(); } }, {passive:false});
canvas.addEventListener('touchmove', e => { if(state==='playing'){ setTargetFromEvent(e.touches[0].clientY); e.preventDefault(); } }, {passive:false});
document.addEventListener('keydown', e => {
  if(state!=='playing') return;
  if(e.key === 'ArrowUp') player.targetY -= 40;
  if(e.key === 'ArrowDown') player.targetY += 40;
});
</script>
</body>
</html>
