<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Zabka vs. Kakerlake</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.game-wrap{max-width:420px; margin:0 auto;}
#gameCanvas{width:100%; height:auto; display:block; border-radius:20px; touch-action:none; background:linear-gradient(180deg,#EAF7EC,#D8F0E0);}
.game-shell{position:relative; border-radius:20px; overflow:hidden; box-shadow:0 12px 34px rgba(47,143,91,0.2); border:2px solid #E3F5E9;}
.game-overlay{
  position:absolute; inset:0; background:rgba(18,48,36,0.86); color:#fff;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:24px; gap:12px;
}
.game-overlay h2{font-family:'Baloo 2',sans-serif; font-size:24px; margin:0; color:#FFD37A;}
.game-overlay p{color:#EAF7EC; margin:0; font-size:14px;}
.game-hud{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-family:'Baloo 2',sans-serif; font-weight:700; color:var(--leaf-d);}
</style>
</head>
<body>
<header class="stickynav">
  <a href="index.html" class="brand">🐸 Zabka-Fäscht</a>
  <a href="index.html" class="back">← zrugg</a>
</header>
<div class="wrap">
  <div class="card">
    <div class="tag">Bonus-Gschänk</div>
    <h1>Zabka vs. Kakerlake</h1>
    <p>Wich de Kakerlake us, sammle Frösch. Bi 30 Frösch wartet öppis Süesses uf di... 🥃</p>
  </div>

  <div class="game-wrap">
    <div class="game-hud"><span id="score-display">🐸 0</span><span id="highscore-display">Rekord: 0</span></div>
    <div class="game-shell">
      <canvas id="gameCanvas" width="360" height="560"></canvas>
      <div class="game-overlay" id="overlay">
        <h2>Bereit?</h2>
        <p>Zieh mit Finger/Muus uf und ab. Kakerlake = Game Over. Frösch = Punkt.</p>
        <button class="btn" id="start-btn">Los geht's</button>
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const overlay = document.getElementById('overlay');
const scoreDisplay = document.getElementById('score-display');
const highscoreDisplay = document.getElementById('highscore-display');
const startBtn = document.getElementById('start-btn');

const CAP = 30;
let highscore = parseInt(localStorage.getItem('frosch-game-highscore') || '0');
highscoreDisplay.textContent = 'Rekord: ' + highscore;

const fabiImg = new Image();
fabiImg.src = 'images/fabi-sticker.png';

let state = 'idle'; // idle, playing, over, win
let player = { x: 60, y: H/2, targetY: H/2, r: 26 };
let roaches = [];
let frogs = [];
let score = 0;
let elapsed = 0;
let lastRoachSpawn = 0;
let lastFrogSpawn = 0;
let animId = null;
let lastTime = 0;

function reset(){
  player.y = H/2; player.targetY = H/2;
  roaches = []; frogs = [];
  score = 0; elapsed = 0; lastRoachSpawn = 0; lastFrogSpawn = 0;
  scoreDisplay.textContent = '🐸 0';
}

function currentSpeed(){
  return Math.min(2.6 + elapsed*0.045, 6.5);
}
function roachSpawnInterval(){
  return Math.max(1100 - elapsed*22, 480);
}
function frogSpawnInterval(){
  return Math.max(1800 - elapsed*15, 1100);
}

function spawnRoach(){
  const r = 20;
  const y = r + Math.random()*(H - 2*r);
  roaches.push({x: W+r, y, r});
}
function spawnFrog(){
  const r = 17;
  const y = r + Math.random()*(H - 2*r);
  frogs.push({x: W+r, y, r});
}

function update(dt){
  elapsed += dt/1000;
  const speed = currentSpeed();

  // smooth follow
  player.y += (player.targetY - player.y) * Math.min(1, dt/90);
  player.y = Math.max(player.r, Math.min(H-player.r, player.y));

  lastRoachSpawn += dt;
  if(lastRoachSpawn > roachSpawnInterval()){ spawnRoach(); lastRoachSpawn = 0; }
  lastFrogSpawn += dt;
  if(lastFrogSpawn > frogSpawnInterval()){ spawnFrog(); lastFrogSpawn = 0; }

  roaches.forEach(o => o.x -= speed*(dt/16.7));
  frogs.forEach(o => o.x -= speed*(dt/16.7));
  roaches = roaches.filter(o => o.x > -30);
  frogs = frogs.filter(o => o.x > -30);

  // collisions: roach = game over
  for(const o of roaches){
    const dx = o.x-player.x, dy = o.y-player.y;
    if(Math.sqrt(dx*dx+dy*dy) < o.r+player.r-8){ endGame(false); return; }
  }
  // collisions: frog = point
  frogs = frogs.filter(o => {
    const dx = o.x-player.x, dy = o.y-player.y;
    if(Math.sqrt(dx*dx+dy*dy) < o.r+player.r){
      score++;
      scoreDisplay.textContent = '🐸 ' + score;
      if(score >= CAP){ endGame(true); }
      return false;
    }
    return true;
  });
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#EAF7EC'); grad.addColorStop(1,'#D3EEDD');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

  ctx.font = '34px serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  roaches.forEach(o => ctx.fillText('🪳', o.x, o.y));
  ctx.font = '30px serif';
  frogs.forEach(o => ctx.fillText('🐸', o.x, o.y));

  // player
  ctx.save();
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
  ctx.closePath();
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.clip();
  if(fabiImg.complete && fabiImg.naturalWidth){
    const size = player.r*2.3;
    ctx.drawImage(fabiImg, player.x-size/2, player.y-size/2+4, size, size);
  }
  ctx.restore();
  ctx.lineWidth = 3; ctx.strokeStyle = '#6FCF97';
  ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2); ctx.stroke();
}

function loop(t){
  if(state !== 'playing'){ return; }
  const dt = Math.min(t-lastTime, 40); lastTime = t;
  update(dt);
  draw();
  animId = requestAnimationFrame(loop);
}

function startGame(){
  reset();
  state = 'playing';
  overlay.style.display = 'none';
  lastTime = performance.now();
  animId = requestAnimationFrame(loop);
}

function endGame(won){
  state = won ? 'win' : 'over';
  cancelAnimationFrame(animId);
  if(score > highscore){
    highscore = score;
    localStorage.setItem('frosch-game-highscore', highscore);
    highscoreDisplay.textContent = 'Rekord: ' + highscore;
  }
  overlay.innerHTML = won
    ? `<h2>🥃 30 Frösch!</h2><p>Fabi schuldet dir jetzt en Shot. Verdient!</p><button class="btn" id="restart-btn">Nomol spile</button>`
    : `<h2>Game Over</h2><p>${score} Frösch gsammlet. ${score>=highscore?'Neue Rekord! 🎉':'Vesuechs nomol!'}</p><button class="btn" id="restart-btn">Nomol spile</button>`;
  overlay.style.display = 'flex';
  document.getElementById('restart-btn').onclick = startGame;
}

startBtn.onclick = startGame;

function setTargetFromEvent(clientY){
  const rect = canvas.getBoundingClientRect();
  const scale = H / rect.height;
  player.targetY = (clientY - rect.top) * scale;
}
canvas.addEventListener('pointermove', e => { if(state==='playing') setTargetFromEvent(e.clientY); });
canvas.addEventListener('touchmove', e => { if(state==='playing'){ setTargetFromEvent(e.touches[0].clientY); e.preventDefault(); } }, {passive:false});
document.addEventListener('keydown', e => {
  if(state!=='playing') return;
  if(e.key === 'ArrowUp') player.targetY -= 40;
  if(e.key === 'ArrowDown') player.targetY += 40;
});
</script>
</body>
</html>
