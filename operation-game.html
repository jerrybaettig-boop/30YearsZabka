<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fabis Operation</title>
<link rel="stylesheet" href="assets/style.css">
<style>
body{overscroll-behavior:none;}
.game-page-wrap{max-width:480px; margin:0 auto; padding:16px;}
#gameCanvas{width:100%; height:auto; display:block; border-radius:20px; touch-action:none;}
.game-shell{position:relative; border-radius:20px; overflow:hidden; box-shadow:0 12px 34px rgba(47,143,91,0.2); border:2px solid #E3F5E9;}
.game-shell.flash{animation:flashred .25s;}
@keyframes flashred{0%,100%{filter:none;} 50%{filter:brightness(1.6) saturate(1.8);}}
.game-overlay{
  position:absolute; inset:0; background:rgba(18,48,36,0.85); color:#fff;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:20px; gap:10px; z-index:5;
}
.game-overlay h2{font-family:'Baloo 2',sans-serif; font-size:22px; margin:0; color:#FFD37A;}
.game-overlay p{color:#EAF7EC; margin:0; font-size:13px;}
.game-hud{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-family:'Baloo 2',sans-serif; font-weight:700; color:var(--leaf-d); font-size:14px;}
.title-compact{margin-bottom:10px;}
.title-compact h1{margin-bottom:2px; font-size:21px;}
.title-compact p{margin:0; font-size:12.5px;}
</style>
</head>
<body>
<header class="stickynav">
  <a href="index.html" class="brand">🐸 Zabka-Fäscht</a>
  <a href="index.html" class="back">← zrugg</a>
</header>
<div class="game-page-wrap">
  <div class="title-compact">
    <h1>💉 Fabis Operation</h1>
    <p>Zieh d Spritzä mit ruehiger Hand dur de Kanal. Wand berüehre = Buzzer!</p>
  </div>

  <div class="game-hud"><span id="level-display">Level 1/10</span><span id="lives-display">❤️❤️❤️</span></div>
  <div class="game-shell" id="game-shell">
    <canvas id="gameCanvas" width="380" height="560"></canvas>
    <div class="game-overlay" id="overlay">
      <h2>Ruehigi Hand parat?</h2>
      <p>Finger uf de Canvas leg und dur de grüen Kanal ziele, ohni d Wand z'berüehre.</p>
      <button class="btn" id="start-btn">Operation start</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const shell = document.getElementById('game-shell');
const W = canvas.width, H = canvas.height;
const overlay = document.getElementById('overlay');
const levelDisplay = document.getElementById('level-display');
const livesDisplay = document.getElementById('lives-display');
const startBtn = document.getElementById('start-btn');

const MAX_LEVEL = 10;
let highscore = parseInt(localStorage.getItem('operation-game-highlevel') || '0');

let state = 'idle';
let level = 1;
let lives = 3;
let player = { x: 0, y: H/2, targetY: H/2 };
let invuln = 0;
let animId = null;
let lastTime = 0;
let offCanvas, offCtx;
let amplitude, wavelength, phase, tubeR, speed;

function centerY(x){
  return H/2 + Math.sin((x/wavelength) + phase) * amplitude;
}

function generateLevel(lv){
  amplitude = Math.min(60 + lv*14, 180);
  wavelength = Math.max(150 - lv*8, 70);
  phase = Math.random()*Math.PI*2;
  tubeR = Math.max(34 - lv*2, 15);
  speed = 55 + lv*7; // px/sec

  offCanvas = document.createElement('canvas');
  offCanvas.width = W; offCanvas.height = H;
  offCtx = offCanvas.getContext('2d');
  offCtx.clearRect(0,0,W,H);
  offCtx.strokeStyle = '#fff';
  offCtx.lineWidth = tubeR*2;
  offCtx.lineCap = 'round';
  offCtx.lineJoin = 'round';
  offCtx.beginPath();
  for(let x=0; x<=W; x+=4){
    const y = centerY(x);
    if(x===0) offCtx.moveTo(x,y); else offCtx.lineTo(x,y);
  }
  offCtx.stroke();

  player.x = 0;
  player.y = centerY(0);
  player.targetY = player.y;
}

function isSafe(x,y){
  if(x<0||x>=W||y<0||y>=H) return false;
  const d = offCtx.getImageData(Math.floor(x), Math.floor(y), 1, 1).data;
  return d[3] > 100;
}

function reset(){
  level = 1; lives = 3; invuln = 0;
  generateLevel(level);
  levelDisplay.textContent = 'Level 1/' + MAX_LEVEL;
  livesDisplay.textContent = '❤️❤️❤️';
}

function update(dt){
  player.y += (player.targetY - player.y) * Math.min(1, dt/60);
  player.x += speed*(dt/1000);
  if(player.x >= W-1){
    if(level >= MAX_LEVEL){ endGame(true); return; }
    level++;
    generateLevel(level);
    levelDisplay.textContent = 'Level ' + level + '/' + MAX_LEVEL;
    return;
  }
  if(invuln>0){ invuln -= dt; }
  else if(!isSafe(player.x, player.y)){
    lives--;
    invuln = 700;
    livesDisplay.textContent = '❤️'.repeat(Math.max(lives,0)) + '🖤'.repeat(3-Math.max(lives,0));
    shell.classList.remove('flash'); void shell.offsetWidth; shell.classList.add('flash');
    if(lives<=0){ endGame(false); return; }
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#3a1620';
  ctx.fillRect(0,0,W,H);
  ctx.drawImage(offCanvas, 0, 0);
  ctx.globalCompositeOperation = 'source-atop';
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#6FCF97'); grad.addColorStop(1,'#2F8F5B');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation = 'source-over';

  // finish line
  ctx.strokeStyle = '#FFD37A'; ctx.lineWidth = 4; ctx.setLineDash([8,6]);
  ctx.beginPath(); ctx.moveTo(W-2,0); ctx.lineTo(W-2,H); ctx.stroke();
  ctx.setLineDash([]);

  ctx.save();
  if(invuln>0 && Math.floor(performance.now()/80)%2===0) ctx.globalAlpha = 0.4;
  ctx.font='30px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('💉', player.x, player.y);
  ctx.restore();
}

function loop(t){
  if(state !== 'playing'){ return; }
  const dt = Math.min(t-lastTime, 40); lastTime = t;
  update(dt);
  if(state !== 'playing') return;
  draw();
  animId = requestAnimationFrame(loop);
}

function startGame(){
  reset();
  state = 'playing';
  overlay.style.display = 'none';
  lastTime = performance.now();
  animId = requestAnimationFrame(loop);
}

function endGame(won){
  state = won ? 'win' : 'over';
  cancelAnimationFrame(animId);
  if(level > highscore){
    highscore = level;
    localStorage.setItem('operation-game-highlevel', highscore);
  }
  overlay.innerHTML = won
    ? `<h2>🏆 Ruehigi-Hand-Meischterin!</h2><p>Alli 10 Level ohni Nerve-Zsammebruch gschafft!</p><button class="btn" id="restart-btn">Nomol</button>`
    : `<h2>Buzzer! 🚨</h2><p>Bis Level ${level}/${MAX_LEVEL} gschafft. Bescht: ${highscore}</p><button class="btn" id="restart-btn">Nomol</button>`;
  overlay.style.display = 'flex';
  document.getElementById('restart-btn').onclick = startGame;
}

startBtn.onclick = startGame;

function setTargetFromEvent(clientY){
  const rect = canvas.getBoundingClientRect();
  const scale = H / rect.height;
  player.targetY = (clientY - rect.top) * scale;
}
canvas.addEventListener('pointermove', e => { if(state==='playing') setTargetFromEvent(e.clientY); });
canvas.addEventListener('pointerdown', e => { if(state==='playing') setTargetFromEvent(e.clientY); });
canvas.addEventListener('touchstart', e => { if(state==='playing'){ setTargetFromEvent(e.touches[0].clientY); e.preventDefault(); } }, {passive:false});
canvas.addEventListener('touchmove', e => { if(state==='playing'){ setTargetFromEvent(e.touches[0].clientY); e.preventDefault(); } }, {passive:false});
document.addEventListener('keydown', e => {
  if(state!=='playing') return;
  if(e.key === 'ArrowUp') player.targetY -= 40;
  if(e.key === 'ArrowDown') player.targetY += 40;
});
</script>
</body>
</html>
