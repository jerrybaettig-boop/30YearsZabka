<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fabis Shopping-Sucht</title>
<link rel="stylesheet" href="assets/style.css">
<style>
body{overscroll-behavior:none;}
.game-page-wrap{max-width:480px; margin:0 auto; padding:16px;}
#gameCanvas{width:100%; height:auto; display:block; border-radius:20px; touch-action:none;}
.game-shell{position:relative; border-radius:20px; overflow:hidden; box-shadow:0 12px 34px rgba(47,143,91,0.2); border:2px solid #E3F5E9;}
.game-overlay{
  position:absolute; inset:0; background:rgba(18,48,36,0.85); color:#fff;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:20px; gap:10px; z-index:5;
}
.game-overlay h2{font-family:'Baloo 2',sans-serif; font-size:22px; margin:0; color:#FFD37A;}
.game-overlay p{color:#EAF7EC; margin:0; font-size:13px;}
.game-hud{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-family:'Baloo 2',sans-serif; font-weight:700; color:var(--leaf-d); font-size:15px;}
.title-compact{margin-bottom:10px;}
.title-compact h1{margin-bottom:2px; font-size:22px;}
.title-compact p{margin:0; font-size:13px;}

.fs-btn{display:block; margin:10px auto 0; width:fit-content;}
.game-shell:fullscreen{width:100vw; height:100vh; border-radius:0; display:flex; align-items:center; justify-content:center; background:#000;}
.game-shell:-webkit-full-screen{width:100vw; height:100vh; border-radius:0; display:flex; align-items:center; justify-content:center; background:#000;}
.game-shell:fullscreen #gameCanvas, .game-shell:-webkit-full-screen #gameCanvas{width:auto !important; height:100vh !important; max-width:100vw;}
</style>
</head>
<body>
<header class="stickynav">
  <a href="index.html" class="brand">🐸 Zabka-Fäscht</a>
  <a href="index.html" class="back">← zrugg</a>
</header>
<div class="game-page-wrap">
  <div class="title-compact">
    <h1>🛍️ Fabis Shopping-Sucht</h1>
    <p>Tipp im richtige Momänt zum Abelah — je präziser, desto höcher gaht de Stapel Iichauftüte.</p>
  </div>

  <div class="game-hud"><span id="score-display">🛍️ 0</span><span id="highscore-display">Rekord: 0</span></div>
  <div class="game-shell">
    <canvas id="gameCanvas" width="380" height="640"></canvas>
    <div class="game-overlay" id="overlay">
      <h2>Bereit zum Staple?</h2>
      <p>De Block bewegt sich hin und här — tipp zum Abelah. Trifft er nöd genau, wird de Turm schmaler.</p>
      <button class="btn" id="start-btn">Los goht's</button>
    </div>
  </div>
  <button class="btn secondary fs-btn" id="fs-btn">⛶ Vollbildmodus</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const fsBtn = document.getElementById('fs-btn');
const gameShellEl = document.querySelector('.game-shell');
if(fsBtn){
  fsBtn.onclick = () => {
    if(gameShellEl.requestFullscreen) gameShellEl.requestFullscreen();
    else if(gameShellEl.webkitRequestFullscreen) gameShellEl.webkitRequestFullscreen();
  };
}

const W = canvas.width, H = canvas.height;
const overlay = document.getElementById('overlay');
const scoreDisplay = document.getElementById('score-display');
const highscoreDisplay = document.getElementById('highscore-display');
const startBtn = document.getElementById('start-btn');

const BLOCK_H = 34;
const ICONS = ['🛍️','👛','👠','💄','👗','🧥'];
let highscore = parseInt(localStorage.getItem('turm-game-highscore') || '0');
highscoreDisplay.textContent = 'Rekord: ' + highscore;

let state = 'idle';
let stack = []; // {x, w, icon}
let current = { x:0, w:0, dir:1, speed:0, icon:'🍫' };
let cameraY = 0;
let score = 0;
let animId = null;
let lastTime = 0;
let particles = [];
let shakeT = 0;

function reset(){
  stack = [{x: W/2 - 70, w: 140, icon:'🛍️'}];
  cameraY = 0; score = 0; particles = []; shakeT = 0;
  spawnNext();
  scoreDisplay.textContent = '🛍️ 0';
}

function spawnNext(){
  const top = stack[stack.length-1];
  current = {
    x: Math.random()<0.5 ? -160 : W+20,
    w: top.w,
    dir: Math.random()<0.5 ? 1 : -1,
    speed: Math.min(2.2 + score*0.09, 6.5),
    icon: ICONS[stack.length % ICONS.length]
  };
  if(current.x < 0) current.dir = 1; else current.dir = -1;
}

function drop(){
  if(state !== 'playing') return;
  const top = stack[stack.length-1];
  const overlapStart = Math.max(top.x, current.x);
  const overlapEnd = Math.min(top.x+top.w, current.x+current.w);
  const overlapW = overlapEnd - overlapStart;

  if(overlapW <= 4){
    startFail();
    return;
  }
  stack.push({x: overlapStart, w: overlapW, icon: current.icon});
  score++;
  scoreDisplay.textContent = '🛍️ ' + score;
  if(overlapW < current.w*0.94){ shakeT = 200; }
  spawnNext();
  const targetCam = Math.max(0, (stack.length-6) * BLOCK_H);
  cameraAnimTo = targetCam;
  if(score >= 30){ startWin(); }
}
let cameraAnimTo = 0;

function startWin(){
  cancelAnimationFrame(animId);
  state = 'win';
  if(score > highscore){
    highscore = score;
    localStorage.setItem('turm-game-highscore', highscore);
    highscoreDisplay.textContent = 'Rekord: ' + highscore;
  }
  overlay.innerHTML = `<h2>🏆 30 Tüte gstapled!</h2><p>Offiziell Shopping-Weltrekord. Regel: wär grad rächts vo dir hockt, schuldet dir jetzt en Drink! 🍹</p><button class="btn" id="restart-btn">Nomol</button>`;
  overlay.style.display = 'flex';
  document.getElementById('restart-btn').onclick = startGame;
}

function startFail(){
  cancelAnimationFrame(animId);
  state = 'over';
  if(score > highscore){
    highscore = score;
    localStorage.setItem('turm-game-highscore', highscore);
    highscoreDisplay.textContent = 'Rekord: ' + highscore;
  }
  overlay.innerHTML = `<h2>Umgheit! 💥</h2><p>${score} Tüte gschafft. ${score>=highscore && score>0?'Neue Rekord! 🎉':'Versuechs nomol!'}</p><button class="btn" id="restart-btn">Nomol</button>`;
  overlay.style.display = 'flex';
  document.getElementById('restart-btn').onclick = startGame;
}

function update(dt){
  current.x += current.dir*current.speed*(dt/16.7);
  if(current.x < -160) current.dir = 1;
  if(current.x > W+20) current.dir = -1;
  cameraY += (cameraAnimTo - cameraY)*Math.min(1, dt/150);
  if(shakeT>0) shakeT -= dt;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#FDEFF4'); grad.addColorStop(1,'#EAF7EC');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

  const shakeX = shakeT>0 ? (Math.random()-0.5)*6 : 0;
  ctx.save();
  ctx.translate(shakeX, 0);

  const baseY = H - 60;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  stack.forEach((b,i)=>{
    const y = baseY - i*BLOCK_H + cameraY;
    if(y < -BLOCK_H || y > H+BLOCK_H) return;
    const hue = 20 + (i*11)%40;
    ctx.fillStyle = i%2===0 ? '#C9885A' : '#E0A978';
    ctx.fillRect(b.x, y-BLOCK_H/2, b.w, BLOCK_H-3);
    ctx.font='18px serif';
    ctx.fillText(b.icon, b.x+b.w/2, y-BLOCK_H/2+BLOCK_H/2-1);
  });

  if(state==='playing'){
    const y = baseY - stack.length*BLOCK_H + cameraY;
    ctx.fillStyle = '#2F8F5B';
    ctx.fillRect(current.x, y-BLOCK_H/2, current.w, BLOCK_H-3);
    ctx.font='18px serif';
    ctx.fillText(current.icon, current.x+current.w/2, y-BLOCK_H/2+BLOCK_H/2-1);
  }
  ctx.restore();
}

function loop(t){
  if(state !== 'playing'){ return; }
  const dt = Math.min(t-lastTime, 40); lastTime = t;
  update(dt);
  draw();
  animId = requestAnimationFrame(loop);
}

function startGame(){
  reset();
  state = 'playing';
  overlay.style.display = 'none';
  lastTime = performance.now();
  animId = requestAnimationFrame(loop);
}

startBtn.onclick = startGame;
canvas.addEventListener('pointerdown', drop);
canvas.addEventListener('touchstart', e => { drop(); e.preventDefault(); }, {passive:false});
document.addEventListener('keydown', e => { if(e.key===' '){ drop(); e.preventDefault(); } });
</script>
</body>
</html>
